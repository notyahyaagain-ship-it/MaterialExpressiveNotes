name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q MaterialExpressiveNotes.zip -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix JVM targets
        working-directory: project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text()

          # Make Java compile for JVM 17.
          if "compileOptions" not in text:
              text = text.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""",
                  1
              )

          # Make Kotlin compile for JVM 17.
          if "jvmTarget" not in text:
              marker = "android {"
              pos = text.find(marker)

              if pos != -1:
                  depth = 0
                  end = None

                  for i in range(pos, len(text)):
                      if text[i] == "{":
                          depth += 1
                      elif text[i] == "}":
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break

                  if end:
                      text = (
                          text[:end]
                          + """

          kotlinOptions {
              jvmTarget = "17"
          }
          """
                          + text[end:]
                      )

          path.write_text(text)
          print("JVM configuration fixed.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaterialExpressiveNotes-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
